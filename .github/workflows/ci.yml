name: Demo video skill CI

# Runs on every branch push and pull request, and from build-release.yml before every release.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Bootstrap isolated runtime
        run: node scripts/bootstrap.mjs
      - name: Check platform capabilities
        shell: bash
        run: node "$HOME/.demo_video/scripts/doctor.mjs" --json
      - name: Run recorder, encoder, narration, and GOP tests
        shell: bash
        run: node "$HOME/.demo_video/scripts/self-test.mjs"
      - name: Validate desktop definition
        run: python scripts/desktop-runner.py tests/desktop-smoke.recording.json --validate
      - name: Check paired delivery and narration revisions
        shell: bash
        run: node "$HOME/.demo_video/scripts/release-test.mjs"
      - name: Build portable release archive
        run: python scripts/package-skill.py . dist-test

  ocr-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Bootstrap isolated runtime
        run: node scripts/bootstrap.mjs
      - name: Run OCR evidence test
        shell: pwsh
        run: node "$HOME/.demo_video/scripts/self-test.mjs" --with-ocr
